<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SafeRoute AI — Smart & Safe Navigation for Women</title>
    <meta name="description" content="AI-powered safe navigation platform for women travelling at night with smart route scoring, SHAP explainability, and emergency assistance." />
    <meta property="og:title" content="SafeRoute AI — Smart & Safe Navigation for Women" />
    <meta property="og:description" content="AI-powered safe navigation platform for women travelling at night with smart route scoring, SHAP explainability, and emergency assistance." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('saferoute_theme');
          var theme = saved === 'light' ? 'light' : 'dark';
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
